[project]
name = "nuramesh"
version = "0.1.0"
description = "NuraMesh is an open-core platform: the control plane for AI agents. Every action verified, approved where it matters, and always on the record."
readme = "README.md"
authors = [
    { name = "AI Collective Labs", email = "opensource@nuramesh.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
keywords = ["ai-agents", "verification", "governance", "ledger", "budgets", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3,<3",
]

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0.3,<7",
]
client = [
    "httpx>=0.28,<1",
]
langgraph = [
    "langgraph>=1.2.22,<2",
    "langchain-core>=1.8.0,<2",
    "langsmith>=0.14.17,<1",
]
server = [
    "fastapi>=0.162.7,<1",
    "uvicorn[standard]>=0.54,<1",
    "cryptography>=50,<51",
]
local = [
    "pyyaml>=6.0.3,<7",
    "fastapi>=0.162.7,<1",
    "uvicorn[standard]>=0.54,<1",
    "cryptography>=50,<51",
]
anchors = [
    "cryptography>=50,<51",
]
content = [
    "cryptography>=50,<51",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
azure = [
    "azure-identity>=1.27.0,<2",
]
temporal = [
    "temporalio==1.36.1",
]
otel = [
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[project.scripts]
nuramesh = "nuramesh.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "cyclonedx-bom==7.6.0",
    "httpx>=0.28,<1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "rfc8785==0.1.4",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 300
timeout_method = "thread"
timeout = 300
markers = [
    "serial: the test must not overlap another serial test on another xdist worker",
    "real_server: the test starts a real uvicorn server",
    "docker: the test needs a live Docker daemon",
    "host_privileged: the test sets setuid, setgid or sticky mode bits",
    "live_model: calls a real model API; deselected by default",
    "quiet: measures speed against a wall-clock bound; runs only with NURAMESH_QUIET_LANE=1",
    "real_server_fixed_port: the test binds a nonzero port on purpose",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = [
    "src",
    "verifier",
]
exclude = ["src/nuramesh/templates/"]  # sample projects shipped as data, not our code
strict = true

[[tool.mypy.overrides]]
module = ["azure.*"]  # the optional `azure` extra (keyless Entra ID access); not installed everywhere
ignore_missing_imports = true
