<circle cx="486" cy="142" r="5" fill="#71D9A0"/>
<text x="502" y="148" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Policies</text>
<text x="610" y="148" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#A1A7B3">allow, ask or deny</text>
<rect x="464" y="176" width="352" height="44" rx="10" fill="#0A0C10" stroke="#262B34"/>
<circle cx="486" cy="198" r="5" fill="#71D9A0"/>
<text x="502" y="204" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Budgets</text>
<text x="610" y="204" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#A1A7B3">hard stops before spend</text>
