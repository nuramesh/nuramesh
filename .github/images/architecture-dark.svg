<text x="64" y="198" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#A1A7B3">LangGraph</text>
<text x="64" y="228" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#A1A7B3">OpenAI Agents SDK (Dec)</text>
<text x="64" y="258" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#A1A7B3">Claude Agent SDK (Dec)</text>
<rect x="440" y="60" width="400" height="360" rx="16" fill="#12151B" stroke="#71D9A0" stroke-width="2"/>
<text x="464" y="100" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">NuraMesh control plane</text>
