<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="How NuraMesh works">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A1A7B3"/></marker>
<style>.f{stroke-dasharray:6 6;animation:m 1.6s linear infinite}@keyframes m{to{stroke-dashoffset:-24}}</style></defs>
<rect width="1280" height="520" rx="20" fill="#0A0C10" stroke="#262B34"/>
<rect x="40" y="90" width="300" height="300" rx="16" fill="#12151B" stroke="#262B34" stroke-width="1.5"/>
