<circle cx="486" cy="254" r="5" fill="#71D9A0"/>
<text x="502" y="260" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Gates</text>
<text x="610" y="260" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#A1A7B3">done means verified</text>
<rect x="464" y="288" width="352" height="44" rx="10" fill="#0A0C10" stroke="#262B34"/>
<circle cx="486" cy="310" r="5" fill="#71D9A0"/>
<text x="502" y="316" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Approvals</text>
<text x="610" y="316" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#A1A7B3">who and why, recorded</text>
<rect x="464" y="344" width="352" height="44" rx="10" fill="#0A0C10" stroke="#262B34"/>
<circle cx="486" cy="366" r="5" fill="#71D9A0"/>
<text x="502" y="372" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Ledger</text>
<text x="610" y="372" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#A1A7B3">hash-chained, anchored</text>
