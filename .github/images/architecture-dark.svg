<text x="640" y="40" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">Every call passes the control plane. Every step lands in the ledger.</text>
<rect x="490" y="448" width="300" height="44" rx="22" fill="none" stroke="#71D9A0" stroke-width="1.5"/>
<text x="640" y="476" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#FFFFFF">$ nuramesh ledger verify</text>
<line x1="640" y1="420" x2="640" y2="444" stroke="#A1A7B3" stroke-width="2" marker-end="url(#a)"/>
