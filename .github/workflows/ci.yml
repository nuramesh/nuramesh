name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies with every optional extra (exact versions from uv.lock)
        run: uv sync --all-extras --locked

      # The export rewrites some text, which lengthens three lines past the line-length limit
      # (E501); every other rule is enforced.
      - name: Lint
        run: uv run ruff check . --extend-ignore E501

      - name: Format check
        run: uv run ruff format --check .

      # This tree ships no tests/ folder, so there is no pytest step here: type checks and an
      # install-and-run smoke check instead.
      - name: Type check
        run: uv run mypy src verifier

      - name: Smoke check (package imports and the CLI starts)
        run: |
          uv run python -c "import nuramesh"
          uv run nuramesh --version
