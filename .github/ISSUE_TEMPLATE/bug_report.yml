name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security problem? Do not file it here. See SECURITY.md (security@nuramesh.com)."
  - type: input
    id: version
    attributes:
      label: NuraMesh version
      description: Output of `nuramesh --version`
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest example you can. Remove secrets and keys before pasting.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
