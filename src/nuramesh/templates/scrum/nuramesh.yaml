# The Scrum team template (ND64): a product owner who delegates, a scrum master, two developers,
# a tester and an independent reviewer. One sprint is a plan of tasks: plan, stories, test, review.
# Run it:  nuramesh init my-scrum --template scrum && nuramesh try my-scrum --fake
version: 1
org:
  id: scrum
  name: Scrum team
  roles:
    - {id: product-owner, name: Product owner, kind: chief_of_staff}
    - {id: scrum-master, name: Scrum master, default_model: fake/worker-1}
    - {id: developer, name: Developer, default_model: fake/worker-1}
    - {id: tester, name: Tester, default_model: fake/worker-1}
    - {id: reviewer, name: Independent reviewer, kind: verifier, default_model: fake/reviewer-1}
  agents:
    - {id: product-owner, name: Product owner, role: product-owner}
    - {id: scrum-master, name: Scrum master, role: scrum-master, reports_to: product-owner}
    - {id: developer-1, name: Developer 1, role: developer, reports_to: product-owner}
    - {id: developer-2, name: Developer 2, role: developer, reports_to: product-owner}
    - {id: tester, name: Tester, role: tester, reports_to: product-owner}
    - {id: reviewer, name: Reviewer, role: reviewer, reports_to: product-owner,
       checks: [developer-1, developer-2]}
policies:
  policies:
    - role: product-owner
      rules:
        - {action: delegate, decision: allow, target: "*"}
    - role: scrum-master
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
    - role: developer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
    - role: tester
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
    - role: reviewer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
budgets:
  - {id: scrum-master-monthly, scope: agent, scope_id: scrum-master, limit: {amount: "5.00", currency: USD}}
  - {id: developer-1-monthly, scope: agent, scope_id: developer-1, limit: {amount: "5.00", currency: USD}}
  - {id: developer-2-monthly, scope: agent, scope_id: developer-2, limit: {amount: "5.00", currency: USD}}
  - {id: tester-monthly, scope: agent, scope_id: tester, limit: {amount: "5.00", currency: USD}}
  - {id: reviewer-monthly, scope: agent, scope_id: reviewer, limit: {amount: "5.00", currency: USD}}
prices:
  prices:
    - {provider: fake, model: worker-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
    - {provider: fake, model: reviewer-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
