# The code-review team template (R1.28): a Chief of Staff who delegates, a change summarizer and two
# independent reviewers (code, security), each on a different model. A change is accepted only when
# both reviewers pass it. Nobody here writes the change they review.
# Run it:  nuramesh init my-review --template code-review && nuramesh try my-review --fake
version: 1
org:
  id: code-review
  name: Code review
  roles:
    - {id: chief-of-staff, name: Chief of Staff, kind: chief_of_staff}
    - {id: change-summarizer, name: Change summarizer, default_model: fake/worker-1}
    - {id: code-reviewer, name: Code reviewer, kind: verifier, default_model: fake/reviewer-1}
    - {id: security-reviewer, name: Security reviewer, kind: verifier, default_model: fake/reviewer-2}
  agents:
    - {id: chief-of-staff, name: Chief of Staff, role: chief-of-staff}
    - {id: change-summarizer, name: Change summarizer, role: change-summarizer,
       reports_to: chief-of-staff}
    - {id: code-reviewer, name: Code reviewer, role: code-reviewer,
       reports_to: chief-of-staff, checks: [change-summarizer]}
    - {id: security-reviewer, name: Security reviewer, role: security-reviewer,
       reports_to: chief-of-staff, checks: [change-summarizer]}
policies:
  policies:
    - role: chief-of-staff
      rules:
        - {action: delegate, decision: allow, target: "*"}
    - role: change-summarizer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
    - role: code-reviewer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
    - role: security-reviewer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
budgets:
  - {id: summarizer-monthly, scope: agent, scope_id: change-summarizer, limit: {amount: "5.00", currency: USD}}
  - {id: code-reviewer-monthly, scope: agent, scope_id: code-reviewer, limit: {amount: "5.00", currency: USD}}
  - {id: security-monthly, scope: agent, scope_id: security-reviewer, limit: {amount: "5.00", currency: USD}}
prices:
  prices:
    - {provider: fake, model: worker-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
    - {provider: fake, model: reviewer-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
    - {provider: fake, model: reviewer-2, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
