# The Kanban team template (ND64): a flow lead who delegates, a developer, a tester and an
# independent reviewer. Cards flow Backlog, Doing, Testing, Done one at a time (a work-in-progress
# limit of one: the plan makes each card wait for the one before it).
# Run it:  nuramesh init my-board --template kanban && nuramesh try my-board --fake
version: 1
org:
  id: kanban
  name: Kanban team
  roles:
    - {id: flow-lead, name: Flow lead, kind: chief_of_staff}
    - {id: developer, name: Developer, default_model: fake/worker-1}
    - {id: tester, name: Tester, default_model: fake/worker-1}
    - {id: reviewer, name: Independent reviewer, kind: verifier, default_model: fake/reviewer-1}
  agents:
    - {id: flow-lead, name: Flow lead, role: flow-lead}
    - {id: developer, name: Developer, role: developer, reports_to: flow-lead}
    - {id: tester, name: Tester, role: tester, reports_to: flow-lead}
    - {id: reviewer, name: Reviewer, role: reviewer, reports_to: flow-lead, checks: [developer]}
policies:
  policies:
    - role: flow-lead
      rules:
        - {action: delegate, decision: allow, target: "*"}
    - role: developer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
    - role: tester
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
    - role: reviewer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
budgets:
  - {id: developer-monthly, scope: agent, scope_id: developer, limit: {amount: "5.00", currency: USD}}
  - {id: tester-monthly, scope: agent, scope_id: tester, limit: {amount: "5.00", currency: USD}}
  - {id: reviewer-monthly, scope: agent, scope_id: reviewer, limit: {amount: "5.00", currency: USD}}
prices:
  prices:
    - {provider: fake, model: worker-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
    - {provider: fake, model: reviewer-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
