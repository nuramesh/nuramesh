# The Data analysis template: an Analyst answers a question from the bundled sample database
# (data/sales.sql, loaded into SQLite in memory), a rule gate recomputes the numbers by a second
# route, and an independent Number checker (a different model) checks the written summary against
# the figures. Default deny: only the listed actions are allowed. Offline on the fake model.
# Run it:  nuramesh init my-analysis --template data-analysis && nuramesh try my-analysis --fake
version: 1
org:
  id: data-analysis
  name: Data analysis team
  roles:
    - {id: analysis-lead, name: Analysis lead, kind: chief_of_staff}
    - {id: analyst, name: Analyst, default_model: fake/worker-1}
    - {id: summarizer, name: Summarizer, default_model: fake/worker-1}
    - {id: number-checker, name: Number checker, kind: verifier, default_model: fake/reviewer-1}
  agents:
    - {id: analysis-lead, name: Analysis lead, role: analysis-lead}
    - {id: analyst, name: Analyst, role: analyst, reports_to: analysis-lead}
    - {id: summarizer, name: Summarizer, role: summarizer, reports_to: analysis-lead}
    - {id: number-checker, name: Number checker, role: number-checker, reports_to: analysis-lead, checks: [analyst, summarizer]}
policies:
  policies:
    - role: analysis-lead
      rules:
        - {action: delegate, decision: allow, target: "*"}
    - role: analyst
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
        - {action: use_tool, decision: allow, target: "sql-read"}
        - {action: use_tool, decision: deny, target: "sql-write", reason: "analysis never changes the data"}
    - role: summarizer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
        - {action: external_message, decision: ask, target: "*", reason: "a human approves before numbers leave the team"}
    - role: number-checker
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
budgets:
  - {id: analyst-monthly, scope: agent, scope_id: analyst, limit: {amount: "5.00", currency: USD}}
  - {id: summarizer-monthly, scope: agent, scope_id: summarizer, limit: {amount: "5.00", currency: USD}}
  - {id: number-checker-monthly, scope: agent, scope_id: number-checker, limit: {amount: "5.00", currency: USD}}
prices:
  prices:
    - {provider: fake, model: worker-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
    - {provider: fake, model: reviewer-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
