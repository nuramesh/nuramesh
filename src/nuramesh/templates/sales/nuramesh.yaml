# The Sales team template (R2.06): Sales lead delegates; Qualifier and Outreach writer do the work; Claims checker is an
# independent verifier that checks Qualifier. Default deny: only the listed actions are allowed.
# Run it:  nuramesh init my-team --template sales && nuramesh try my-team --fake
version: 1
org:
  id: sales
  name: Sales team
  roles:
    - {id: sales-lead, name: Sales lead, kind: chief_of_staff}
    - {id: qualifier, name: Qualifier, default_model: fake/worker-1}
    - {id: outreach-writer, name: Outreach writer, default_model: fake/worker-1}
    - {id: claims-checker, name: Claims checker, kind: verifier, default_model: fake/reviewer-1}
  agents:
    - {id: sales-lead, name: Sales lead, role: sales-lead}
    - {id: qualifier, name: Qualifier, role: qualifier, reports_to: sales-lead}
    - {id: outreach-writer, name: Outreach writer, role: outreach-writer, reports_to: sales-lead}
    - {id: claims-checker, name: Claims checker, role: claims-checker, reports_to: sales-lead, checks: [qualifier]}
policies:
  policies:
    - role: sales-lead
      rules:
        - {action: delegate, decision: allow, target: "*"}
    - role: qualifier
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
        - {action: external_message, decision: deny, target: "*", reason: "qualifying never contacts a lead"}
    - role: outreach-writer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
        - {action: external_message, decision: ask, target: "*", reason: "a human approves every outreach message"}
        - {action: use_tool, decision: deny, target: "crm-write", reason: "the CRM is never written by an agent"}
    - role: claims-checker
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
budgets:
  - {id: qualifier-monthly, scope: agent, scope_id: qualifier, limit: {amount: "5.00", currency: USD}}
  - {id: outreach-writer-monthly, scope: agent, scope_id: outreach-writer, limit: {amount: "5.00", currency: USD}}
  - {id: claims-checker-monthly, scope: agent, scope_id: claims-checker, limit: {amount: "5.00", currency: USD}}
prices:
  prices:
    - {provider: fake, model: worker-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
    - {provider: fake, model: reviewer-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
