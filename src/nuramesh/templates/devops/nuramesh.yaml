# The DevOps team template (R2.06): Ops lead delegates; Change planner and Staging checker do the work; Change reviewer is an
# independent verifier that checks Change planner. Default deny: only the listed actions are allowed.
# Run it:  nuramesh init my-team --template devops && nuramesh try my-team --fake
version: 1
org:
  id: devops
  name: DevOps team
  roles:
    - {id: ops-lead, name: Ops lead, kind: chief_of_staff}
    - {id: change-planner, name: Change planner, default_model: fake/worker-1}
    - {id: staging-checker, name: Staging checker, default_model: fake/worker-1}
    - {id: change-reviewer, name: Change reviewer, kind: verifier, default_model: fake/reviewer-1}
  agents:
    - {id: ops-lead, name: Ops lead, role: ops-lead}
    - {id: change-planner, name: Change planner, role: change-planner, reports_to: ops-lead}
    - {id: staging-checker, name: Staging checker, role: staging-checker, reports_to: ops-lead}
    - {id: change-reviewer, name: Change reviewer, role: change-reviewer, reports_to: ops-lead, checks: [change-planner]}
policies:
  policies:
    - role: ops-lead
      rules:
        - {action: delegate, decision: allow, target: "*"}
    - role: change-planner
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
        - {action: use_tool, decision: deny, target: "*", reason: "planning changes nothing"}
        - {action: write_file, decision: deny, target: "**", reason: "planning changes no files"}
    - role: staging-checker
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
        - {action: use_tool, decision: allow, target: "staging-health-check", reason: "read-only staging check"}
        - {action: use_tool, decision: ask, target: "deploy-*", reason: "a human approves every deploy"}
        - {action: use_tool, decision: ask, target: "terraform-*", reason: "a human approves every infrastructure change"}
        - {action: write_file, decision: deny, target: "infra/**", reason: "infrastructure files are never edited by an agent"}
    - role: change-reviewer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
budgets:
  - {id: change-planner-monthly, scope: agent, scope_id: change-planner, limit: {amount: "5.00", currency: USD}}
  - {id: staging-checker-monthly, scope: agent, scope_id: staging-checker, limit: {amount: "5.00", currency: USD}}
  - {id: change-reviewer-monthly, scope: agent, scope_id: change-reviewer, limit: {amount: "5.00", currency: USD}}
prices:
  prices:
    - {provider: fake, model: worker-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
    - {provider: fake, model: reviewer-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
