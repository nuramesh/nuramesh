# The Support team template (R2.06): Support lead delegates; Triager and Responder do the work; Reply checker is an
# independent verifier that checks Triager. Default deny: only the listed actions are allowed.
# Run it:  nuramesh init my-team --template support && nuramesh try my-team --fake
version: 1
org:
  id: support
  name: Support team
  roles:
    - {id: support-lead, name: Support lead, kind: chief_of_staff}
    - {id: triager, name: Triager, default_model: fake/worker-1}
    - {id: responder, name: Responder, default_model: fake/worker-1}
    - {id: reply-checker, name: Reply checker, kind: verifier, default_model: fake/reviewer-1}
  agents:
    - {id: support-lead, name: Support lead, role: support-lead}
    - {id: triager, name: Triager, role: triager, reports_to: support-lead}
    - {id: responder, name: Responder, role: responder, reports_to: support-lead}
    - {id: reply-checker, name: Reply checker, role: reply-checker, reports_to: support-lead, checks: [triager]}
policies:
  policies:
    - role: support-lead
      rules:
        - {action: delegate, decision: allow, target: "*"}
    - role: triager
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
        - {action: external_message, decision: deny, target: "*", reason: "triage never contacts a customer"}
    - role: responder
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
        - {action: external_message, decision: ask, target: "*", reason: "a human approves every customer message"}
        - {action: use_tool, decision: deny, target: "refund-*", reason: "refunds are never automatic"}
    - role: reply-checker
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
budgets:
  - {id: triager-monthly, scope: agent, scope_id: triager, limit: {amount: "5.00", currency: USD}}
  - {id: responder-monthly, scope: agent, scope_id: responder, limit: {amount: "5.00", currency: USD}}
  - {id: reply-checker-monthly, scope: agent, scope_id: reply-checker, limit: {amount: "5.00", currency: USD}}
prices:
  prices:
    - {provider: fake, model: worker-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
    - {provider: fake, model: reviewer-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
