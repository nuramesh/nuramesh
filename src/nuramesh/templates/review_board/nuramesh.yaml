# The review-board team template (ND64): a chair who delegates, a change summarizer and three
# independent reviewers, each on a different model (correctness, security, maintainability). A change
# is accepted only when all three pass it. Nobody on the board writes the change they review.
# Run it:  nuramesh init my-board --template review-board && nuramesh try my-board --fake
version: 1
org:
  id: review-board
  name: Review board
  roles:
    - {id: chair, name: Chair, kind: chief_of_staff}
    - {id: change-summarizer, name: Change summarizer, default_model: fake/worker-1}
    - {id: correctness-reviewer, name: Correctness reviewer, kind: verifier, default_model: fake/reviewer-1}
    - {id: security-reviewer, name: Security reviewer, kind: verifier, default_model: fake/reviewer-2}
    - {id: maintainability-reviewer, name: Maintainability reviewer, kind: verifier, default_model: fake/reviewer-3}
  agents:
    - {id: chair, name: Chair, role: chair}
    - {id: change-summarizer, name: Change summarizer, role: change-summarizer, reports_to: chair}
    - {id: correctness-reviewer, name: Correctness reviewer, role: correctness-reviewer,
       reports_to: chair, checks: [change-summarizer]}
    - {id: security-reviewer, name: Security reviewer, role: security-reviewer,
       reports_to: chair, checks: [change-summarizer]}
    - {id: maintainability-reviewer, name: Maintainability reviewer, role: maintainability-reviewer,
       reports_to: chair, checks: [change-summarizer]}
policies:
  policies:
    - role: chair
      rules:
        - {action: delegate, decision: allow, target: "*"}
    - role: change-summarizer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
    - role: correctness-reviewer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
    - role: security-reviewer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
    - role: maintainability-reviewer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
budgets:
  - {id: summarizer-monthly, scope: agent, scope_id: change-summarizer, limit: {amount: "5.00", currency: USD}}
  - {id: correctness-monthly, scope: agent, scope_id: correctness-reviewer, limit: {amount: "5.00", currency: USD}}
  - {id: security-monthly, scope: agent, scope_id: security-reviewer, limit: {amount: "5.00", currency: USD}}
  - {id: maintainability-monthly, scope: agent, scope_id: maintainability-reviewer, limit: {amount: "5.00", currency: USD}}
prices:
  prices:
    - {provider: fake, model: worker-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
    - {provider: fake, model: reviewer-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
    - {provider: fake, model: reviewer-2, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
    - {provider: fake, model: reviewer-3, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
