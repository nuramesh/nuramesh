# The Research report template: a researcher reads the bundled sources, a writer drafts a cited
# report, an independent Fact checker (a different model) verifies every claim against the sources,
# and a human approves before the report counts as published. Default deny: only the listed actions
# are allowed. Everything runs offline on the fake model with the sample sources in sources/.
# Run it:  nuramesh init my-report --template research-report && nuramesh try my-report --fake --approve-as human:you
version: 1
org:
  id: research-report
  name: Research report team
  roles:
    - {id: research-lead, name: Research lead, kind: chief_of_staff}
    - {id: researcher, name: Researcher, default_model: fake/worker-1}
    - {id: writer, name: Writer, default_model: fake/worker-1}
    - {id: fact-checker, name: Fact checker, kind: verifier, default_model: fake/reviewer-1}
  agents:
    - {id: research-lead, name: Research lead, role: research-lead}
    - {id: researcher, name: Researcher, role: researcher, reports_to: research-lead}
    - {id: writer, name: Writer, role: writer, reports_to: research-lead}
    - {id: fact-checker, name: Fact checker, role: fact-checker, reports_to: research-lead, checks: [researcher, writer]}
policies:
  policies:
    - role: research-lead
      rules:
        - {action: delegate, decision: allow, target: "*"}
    - role: researcher
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
        - {action: use_tool, decision: deny, target: "web-*", reason: "this template reads only the bundled sources"}
    - role: writer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
        - {action: external_message, decision: ask, target: "*", reason: "a human approves before a report is shared"}
    - role: fact-checker
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
budgets:
  - {id: researcher-monthly, scope: agent, scope_id: researcher, limit: {amount: "5.00", currency: USD}}
  - {id: writer-monthly, scope: agent, scope_id: writer, limit: {amount: "5.00", currency: USD}}
  - {id: fact-checker-monthly, scope: agent, scope_id: fact-checker, limit: {amount: "5.00", currency: USD}}
prices:
  prices:
    - {provider: fake, model: worker-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
    - {provider: fake, model: reviewer-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "template price list (fake model)"}
