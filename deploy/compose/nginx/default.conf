# The `web` service (R1.29, spec 3.3 and 7.3, ND188 Q5/N1): the TLS listener and the only entry to `api`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /run/secrets/web_tls_cert;
    ssl_certificate_key /run/secrets/web_tls_key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens       off;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /v1/ {
        proxy_pass http://172.29.40.10:8765;
        proxy_http_version 1.1;
        # the browser's own host and port: api checks Host against --allowed-host and Origin against Host
        proxy_set_header Host $http_host;
        # overwritten, never appended: whatever a client sent is discarded
        proxy_set_header X-Forwarded-For $remote_addr;
        # true: this server terminates TLS itself
        proxy_set_header X-Forwarded-Proto https;
        # forwarding headers api does not read are cleared so a client cannot smuggle them
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Host "";
        # the live ledger stream (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
