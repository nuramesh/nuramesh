# Same team as examples/dev-team (a test keeps them in step); workers are LangGraph graphs.
# Run:  nuramesh try examples/dev-team-langgraph --fake --approve-as human:demo  (uv sync --extra langgraph)
version: 1
org:
  id: devteam-langgraph-example
  name: Demo dev team
  roles:
    - {id: cos, name: Chief of Staff, kind: chief_of_staff}
    - {id: developer, name: Developer, default_model: fake/dev-1}
    - {id: tester, name: Tester, default_model: fake/dev-1}
    - {id: reviewer, name: Independent reviewer, kind: verifier, default_model: fake/reviewer-1}
    - {id: devops, name: DevOps engineer, default_model: fake/dev-1}
  agents:
    - {id: chief, name: Chief of Staff, role: cos}
    - {id: developer, name: Developer, role: developer, reports_to: chief}
    - {id: tester, name: Tester, role: tester, reports_to: chief}
    - {id: reviewer, name: Reviewer, role: reviewer, reports_to: chief}
    - {id: devops, name: DevOps engineer, role: devops, reports_to: chief}
policies:
  policies:
    - role: cos
      rules:
        - {action: delegate, decision: allow, target: "*"}
    - role: developer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
        - {action: write_file, decision: allow, target: "*.py"}
    - role: tester
      rules:
        - {action: run_command, decision: allow, target: "python -m unittest **"}
    - role: reviewer
      rules:
        - {action: call_model, decision: allow, target: "fake/*"}
        - {action: spend, decision: allow}
    - role: devops
      rules:
        - {action: merge, decision: ask, target: "*"}
# Gates for a run started through the API (`nuramesh start`, `POST /v1/runs`): such a plan names
# roles, and each role's tasks get the gates of its preset. `nuramesh try` uses team.py's own plan,
# which must carry the same gate for the role.
presets:
  gate:
    - id: deploy-gates
      name: Deploy gates
      gates:
        - id: deploy-plan
          kind: rule
          config:
            rules:
              - {criterion: dod, check: {type: path_equals, path: deploy, value: staging}}
  assignments:
    - {role: devops, gate_preset: deploy-gates}
budgets:
  - {id: developer-monthly, scope: agent, scope_id: developer, limit: {amount: "5.00", currency: USD}}
  - {id: reviewer-monthly, scope: agent, scope_id: reviewer, limit: {amount: "5.00", currency: USD}}
  - {id: devops-monthly, scope: agent, scope_id: devops, limit: {amount: "5.00", currency: USD}}
prices:
  prices:
    - {provider: fake, model: dev-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "demo price list (fake model)"}
    - {provider: fake, model: reviewer-1, input_per_million: "3", output_per_million: "15",
       effective_from: "2026-01-01T00:00:00Z", source: "demo price list (fake model)"}
evals:
  suites:
    - id: dev-basics
      role: developer
      pass_threshold: "0.8"
      valid_days: 30
      cases:
        - id: fixes-the-sum
          prompt: "Reply with the corrected Python function add(a, b) that returns the sum of its arguments."
          rules:
            - {criterion: has-fix, check: {type: contains, value: "return a + b"}}
        - id: keeps-the-signature
          prompt: "Reply with a Python function add(a, b) (keep the name `add`) that returns the sum."
          rules:
            - {criterion: signature, check: {type: contains, value: "def add("}}
          critical: true
  # To require passing evals before an agent gets work, add:
  # requirements:
  #   - {role: developer, suites: [dev-basics]}
